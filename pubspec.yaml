name: expense_tracker_app
description: "Local-first expense tracking with profile-scoped SQLite storage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.2.1
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: '>=2.16.2 <2.17.1'

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome-mascot.svg
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
